<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Mouse • สต็อกสินค้า</title>
  <link rel="stylesheet" href="style_stock.css" />
  <link rel="stylesheet" href="style_sales.css" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon D1.ico">
</head>
<header class="top-nav">
  <div class="nav-title">🐭 Big Mouse • Backoffice</div>
  
  <button class="settings-btn" onclick="openSettings()">⚙️</button>
  <button id="theme-toggle" class="theme-btn" onclick="toggleTheme()">🌙</button>
  
  <nav class="nav-tabs">
    <a href="index.html" class="nav-tab" style="text-decoration:none;">Pricing</a>
    <span class="nav-tab active">Stock</span>
    <a href="sales.html" class="nav-tab" style="text-decoration:none;">Sales</a>
    <a href="orders.html" class="nav-tab" style="text-decoration:none;">Purchases</a>
  </nav>
</header>
<body>
  <div class="wrap">
    
    <div class="title">📦 เช็ค / เติม สต็อกสินค้า</div>

    <section class="card update-card">
      <div class="head"><h2>เติมสต็อกสินค้า</h2></div>
      <div class="row">
        <div class="col">
          <label>วันที่เติมของ</label>
          <input type="date" id="upd-date">
        </div>
        <div class="col">
          <label>ประเภท</label>
          <select id="upd-animal">
            <option value="" disabled selected>-- เลือก --</option>
            <option value="Mice">Mice (หนูไมซ์)</option>
            <option value="Rat">Rat (หนูแรท)</option>
          </select>
        </div>
        <div class="col">
          <label>ไซส์</label>
          <select id="upd-size">
            <option value="" disabled selected>-- รอเลือกประเภท --</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="col">
          <label>จำนวนที่เติม (ตัว)</label>
          <input type="number" id="upd-qty" placeholder="ระบุจำนวนที่เติม" inputmode="numeric">
        </div>
      </div>
      <button class="btn" id="btn-submit" style="width:100%; margin-top:12px;">
        บันทึกการเติมสต็อก
      </button>
    </section>

    <div class="grid">
      <section class="card">
        <div class="head"><h2>สต็อก Mice</h2></div>
        <div class="stock-table-wrap">
          <table id="stock-table-mice">
            <thead><tr><th>ไซส์</th><th>Stock</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="hint" style="margin-top:8px">* ข้อมูลจาก Tab: M Stock</p>
      </section>

      <section class="card">
        <div class="head"><h2>สต็อก Rat</h2></div>
        <div class="stock-table-wrap">
          <table id="stock-table-rat">
            <thead><tr><th>ไซส์</th><th>Stock</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <p class="hint" style="margin-top:8px">* ข้อมูลจาก Tab: R Stock</p>
      </section>
    </div>
  </div>

  <div id="settings-modal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">⚙️ ตั้งค่าไฟล์ Stock</h3>
      <p style="font-size:14px; color:#666;">แปะลิงก์ Google Sheet ที่มี Tab "M Stock" และ "R Stock"</p>
      <label style="font-size:12px; font-weight:bold; display:block; margin-bottom:4px;">Google Sheet URL:</label>
      <input type="text" id="sheet-url-input" placeholder="https://docs.google.com/spreadsheets/d/..." style="width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; margin-bottom:15px;">
      <div style="display:flex; gap:10px;">
        <button class="btn" onclick="saveSettings()" style="flex:1;">บันทึก</button>
        <button class="btn" onclick="closeSettings()" style="flex:1; background:#ccc; color:#333;">ปิด</button>
      </div>
    </div>
  </div>

  <script src="script_stock.js"></script>
</body>
</html>
